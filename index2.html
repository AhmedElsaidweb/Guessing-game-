p{
    color: white;
    font-size: 25px;
    margin-left: 10px;

  
}

#p{ position: absolute;
    right: 10px;
    top: 30px;
    color: white;
    font-size: 40px;
    margin-left: 10px;
    display: none;
    cursor: default;
}

#div{
width: 250px;
height: 200px;

margin: 0 auto;

text-align: center; 
display: flex;
justify-content: center;
align-items: center;
animation-name: x;
animation-duration:7s;
animation-timing-function: linear;
animation-iteration-count: infinite;
}
@keyframes x{
    0%{
        translate: 0 0;
    }
    25%{
        translate: 0 7px;
    }
    50%{
        translate: 0 -7px;
    }
    75%{
        translate: 0 7px;
    }
    0%{
        translate: 0 0;
    }
}

color: white;
}

}
